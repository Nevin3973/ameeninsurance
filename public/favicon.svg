<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge Background -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Shield Emblem with Gradient and Glow -->
  <path d="M256 72 C330 72 400 90 400 90 V240 C400 340 310 415 256 440 C202 415 112 340 112 240 V90 C112 90 182 72 256 72 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />
        
  <!-- Inner Shield Border Highlight -->
  <path d="M256 94 C318 94 376 108 376 108 V232 C376 318 298 385 256 408 C214 385 136 318 136 232 V108 C136 108 194 94 256 94 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.25)" 
        stroke-width="6" />

  <!-- Monogram 'A' Letterform -->
  <path d="M256 160 L324 330 H284 L270 292 H242 L228 330 H188 L256 160 Z M256 222 L248 260 H264 L256 222 Z" 
        fill="#ffffff" />
        
  <!-- Golden Trust Star Accent -->
  <path d="M256 128 L262 144 L278 144 L265 154 L270 170 L256 160 L242 170 L247 154 L234 144 L250 144 Z" 
        fill="url(#goldGrad)" />
</svg>
