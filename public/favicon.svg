<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091427" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Primary Facet Gradient (Left) -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Shield Accent Facet Gradient (Right) -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Golden Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Solid Crisp Corporate Square Base -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Architectural Framing Border -->
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Shield Left Facet -->
  <path d="M256 70 L96 130 V250 C96 352 184 426 256 450 V70 Z" fill="url(#shieldLeft)" />

  <!-- Shield Right Facet -->
  <path d="M256 70 L416 130 V250 C416 352 328 426 256 450 V70 Z" fill="url(#shieldRight)" />

  <!-- Sharp Inner Shield Contour Line -->
  <path d="M256 94 L116 148 V246 C116 334 192 398 256 422 C320 398 396 334 396 246 V148 L256 94 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.35)" 
        stroke-width="6" 
        stroke-linejoin="miter" />

  <!-- Central 'A' Monogram & Healthcare Trust Pillar -->
  <polygon points="256,155 210,325 240,325 251,280 261,280 272,325 302,325" fill="#ffffff" />
  <polygon points="256,205 245,255 267,255" fill="#0f172a" />

  <!-- Golden Health Cross / Star of Trust at Apex -->
  <rect x="238" y="112" width="36" height="12" fill="url(#goldGrad)" />
  <rect x="250" y="100" width="12" height="36" fill="url(#goldGrad)" />

  <!-- Golden Base Accent Diamond -->
  <polygon points="256,360 268,376 256,392 244,376" fill="url(#goldGrad)" />
</svg>
